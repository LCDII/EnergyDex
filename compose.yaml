services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      ENERGYDEX_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      ENERGYDEX_DATABASE_USER: ${POSTGRES_USER}
      ENERGYDEX_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      ENERGYDEX_REDIS_URI: redis://redis:6379
      ENERGYDEX_JWT_SECRET: ${ENERGYDEX_JWT_SECRET}
      ENERGYDEX_SMTP_HOST: mailpit
      ENERGYDEX_SMTP_PORT: ${MAILPIT_SMTP_PORT}
      ENERGYDEX_SMTP_FROM: ${ENERGYDEX_SMTP_FROM:-noreply@energydex.local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"

volumes:
  postgres-data:
  redis-data:
